<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Valkaya Studio — Independent mobile game developers crafting immersive racing and action experiences." />
    <meta name="theme-color" content="#0D0F1A" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/logo.png" />
    <link rel="apple-touch-icon" href="./images/logo.png" />

    <!-- Open Graph -->
    <meta property="og:image" content="./images/logo.png" />
    <meta property="og:title" content="Valkaya Studio" />
    <meta property="og:description" content="Independent mobile game developers crafting immersive experiences." />
    <meta property="og:type" content="website" />

    <title>Valkaya Studio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- App scripts (order matters: each relies on globals defined before it) -->
  <script type="text/babel" src="./js/icons.jsx"></script>
  <script type="text/babel" src="./js/data.jsx"></script>
  <script type="text/babel" src="./js/pages.jsx"></script>
  <script type="text/babel" src="./js/app.jsx"></script>
</body>
</html>
